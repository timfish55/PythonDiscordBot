name: Update Notification 

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "錯誤：找不到 DISCORD_WEBHOOK_URL Secret"
            exit 1
          fi

          export TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg title "🚀 GitHub Pages 程式碼更新" \
            --arg description "GitHub 儲存庫收到新的程式碼推送。" \
            --arg repository "$REPOSITORY" \
            --arg repository_url "$REPOSITORY_URL" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg message "${COMMIT_MESSAGE:-未提供提交訊息}" \
            --arg timestamp "$TIMESTAMP" \
            '{
              username: "GitHub Pages 通知",
              allowed_mentions: {parse: []},
              embeds: [
                {
                  title: $title,
                  url: $repository_url,
                  description: $description,
                  color: 5793266,
                  fields: [
                    {
                      name: "📦 儲存庫",
                      value: ("[" + $repository + "](" + $repository_url + ")"),
                      inline: false
                    },
                    {
                      name: "🌿 分支",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "👤 更新者",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "📝 提交訊息",
                      value: ($message[0:1000]),
                      inline: false
                    },
                    {
                      name: "🔖 Commit",
                      value: ("[`" + $sha + "`](" + $commit_url + ")"),
                      inline: true
                    }
                  ],
                  footer: {
                    text: "Python Discord Bot 自動更新通知"
                  },
                  timestamp: $timestamp
                }
              ]
            }' > payload.json

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"

          echo "Discord Embed 通知已成功送出。"
          
